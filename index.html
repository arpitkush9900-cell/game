<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Birthday Game 🎂</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game">

        <h1>🎂 Birthday Run</h1>

        <p class="instruction">
            Jump over the cakes and survive for 10 seconds!
        </p>

        <div id="gameArea">

            <div id="girl">👧</div>

            <div id="cake">🎂</div>

            <div id="ground"></div>

        </div>

        <div id="timer">
         10
        </div>

<button id="startButton">START GAME</button>

<div id="message"></div>

<div id="birthdayCard">

    <div class="cardEmoji">🎉</div>

    <h2>CONGRATULATIONS!</h2>

    <p>YOU COMPLETED THE GAME</p>

    <h3>HAPPY BIRTHDAY, DEAREST LAWANYA! 🎂</h3>

</div>

    </div>

    <script src="script.js"></script>

</body>

</html>
